[project]
name = "whatsapp-reader"
version = "0.1.0"
description = "Live, pseudonymised transcripts and digests of WhatsApp group chats via a linked device"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "pydantic>=2",
    "chatagent",
]

[project.scripts]
whatsapp-reader = "whatsapp_reader.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
chatagent = { path = "../chat-agent", editable = true }  # clone https://github.com/Adellama75/chat-agent next to this repo
